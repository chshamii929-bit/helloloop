services:
  - type: web
    name: helloloop-staging
    runtime: node
    rootDir: app
    repo: https://github.com/chshamii929-bit/helloloop
    branch: main
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: STAGING_ACCESS_CODE
        generateValue: true
      - key: PUBLIC_ORIGIN
        fromService:
          type: web
          name: helloloop-staging
          envVarKey: RENDER_EXTERNAL_URL
      - key: MAX_CONNECTIONS
        value: 100




