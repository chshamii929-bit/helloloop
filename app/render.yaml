services:
  - type: web
    name: helloloop-staging
    runtime: node
    plan: free
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: STAGING_ACCESS_CODE
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: MAX_CONNECTIONS
        value: 100


